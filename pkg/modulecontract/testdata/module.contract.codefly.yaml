# A module contract of the agreed shape: a request, bounded later by the
# envelope, the authority document and an installation.
schema: codefly/module-contract/v1
principal: assistant
namespaces:
    - assistant
queues: []
scope_ceilings:
    - resource_kind: assistant.tasks
      actions: [execute]
    - resource_kind: assistant.answers
      actions: [read, review]
bindings:
    # A slot's key carries its meaning: audience from a *-audience key,
    # resource_kind from a *-resource-kind key, binding_key from a *-binding key.
    - id: model
      operations: [invoke, lookup]
      lookup: {method: profile}
      audience: {from: assistant/model-audience}
      resource_kind: {from: assistant/model-resource-kind}
      binding_key: {from: assistant/model-binding}
      scope_ceiling:
          invoke: [invoke, read]
          lookup: [read]
    - id: evidence
      revision: 2
      operations: [invoke]
      audience: {from: assistant/evidence-audience}
      resource_kind: {from: assistant/evidence-resource-kind}
      scope_ceiling:
          invoke: [read]
    # A binding whose acts span two resource kinds declares no resource_kind
    # slot and spells each scope out, naming the other module's permission
    # namespace literally: a namespace is fixed by the module that contributes
    # it, while a service the composition chooses stays a slot.
    - id: annotations
      operations: [headless]
      audience: {from: assistant/annotations-prefix}
      scope_ceiling:
          headless:
              - resource_kind: annotations.vocabularies
                actions: [write]
              - resource_kind: annotations.annotations
                actions: [redact]
destinations:
    - id: chat-http
      service: chat
      endpoint: http
      kind: module
    - id: host-health
      service: host
      endpoint: health
      kind: platform-internal

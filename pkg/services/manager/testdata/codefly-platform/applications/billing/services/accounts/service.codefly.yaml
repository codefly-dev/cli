kind: service
name: accounts
version: 0.0.0
application: billing
project: codefly-platform
namespace: default
agent:
    kind: runtime::service
    name: go-grpc
    version: 0.0.16
    publisher: codefly.ai
service-dependencies:
  - name: organization
    application: management
endpoints:
    - name: grpc
      api: grpc
    - name: rest
      visibility: public
      api: rest
spec:
    create-rest-endpoint: true
    debug: false
    watch: true
    with-debug-symbols: false

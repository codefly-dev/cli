# Source: cert-manager-csi-driver-spiffe/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cert-manager-csi-driver-spiffe-approver
  namespace: cert-manager
  labels:
    app.kubernetes.io/name: cert-manager-csi-driver-spiffe
    helm.sh/chart: cert-manager-csi-driver-spiffe-v0.15.0
    app.kubernetes.io/instance: csi-driver-spiffe
    app.kubernetes.io/version: "v0.15.0"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cert-manager-csi-driver-spiffe-approver
  template:
    metadata:
      labels:
        app: cert-manager-csi-driver-spiffe-approver
        app.kubernetes.io/name: cert-manager-csi-driver-spiffe
        helm.sh/chart: cert-manager-csi-driver-spiffe-v0.15.0
        app.kubernetes.io/instance: csi-driver-spiffe
        app.kubernetes.io/version: "v0.15.0"
        app.kubernetes.io/managed-by: Helm
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }

      serviceAccountName: cert-manager-csi-driver-spiffe-approver
      containers:
      - name: cert-manager-csi-driver-spiffe-approver
        image: quay.io/jetstack/cert-manager-csi-driver-spiffe-approver:v0.15.0@sha256:5f7a9bbb95fb951ce0c09d97862e3ead4874c5e5344a680446cc2d771bab2044
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 9402
        readinessProbe:
          httpGet:
            port: 6060
            path: "/readyz"
          initialDelaySeconds: 3
          periodSeconds: 7
        args:
          - --log-level=1
          - --csi-driver-name=spiffe.csi.cert-manager.io

          - --certificate-request-duration=1h
          - --issuer-name=csi-driver-spiffe-ca
          - --issuer-kind=ClusterIssuer
          - --issuer-group=cert-manager.io
          - --trust-domain=cluster.local

          - "--runtime-issuance-config-map-name="
          - "--runtime-issuance-config-map-namespace=cert-manager"
          - --leader-election-namespace=$(POD_NAMESPACE)
          - "--metrics-bind-address=:9402"
          - "--readiness-probe-bind-address=:6060"
        env:
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        resources:
            {}

        securityContext:
          allowPrivilegeEscalation: false
          capabilities: { drop: ["ALL"] }
          readOnlyRootFilesystem: true
      nodeSelector:
        kubernetes.io/os: linux


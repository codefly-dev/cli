# Source: cert-manager-csi-driver-spiffe/templates/daemonset.yaml
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: cert-manager-csi-driver-spiffe-driver
  namespace: cert-manager
  labels:
    app.kubernetes.io/name: cert-manager-csi-driver-spiffe
    helm.sh/chart: cert-manager-csi-driver-spiffe-v0.15.0
    app.kubernetes.io/instance: csi-driver-spiffe
    app.kubernetes.io/version: "v0.15.0"
    app.kubernetes.io/managed-by: Helm
spec:
  selector:
    matchLabels:
      app: cert-manager-csi-driver-spiffe
  template:
    metadata:
      labels:
        app: cert-manager-csi-driver-spiffe
        app.kubernetes.io/name: cert-manager-csi-driver-spiffe
        helm.sh/chart: cert-manager-csi-driver-spiffe-v0.15.0
        app.kubernetes.io/instance: csi-driver-spiffe
        app.kubernetes.io/version: "v0.15.0"
        app.kubernetes.io/managed-by: Helm
      annotations:
        kubectl.kubernetes.io/default-container: cert-manager-csi-driver-spiffe
    spec:
      securityContext:
        seccompProfile: { type: RuntimeDefault }
      serviceAccountName: cert-manager-csi-driver-spiffe
      containers:

        - name: node-driver-registrar
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            capabilities: { drop: [ "ALL" ] }
            readOnlyRootFilesystem: true
          image: quay.io/jetstack/csi-node-driver-registrar:v2.17.0@sha256:f9de845b170155199f2a2a3f9531cf13d78e31235e9db6b6582a8b0db0a50dad
          imagePullPolicy: IfNotPresent
          args:
            - -v=1
            - --csi-address=/plugin/csi.sock
            - --kubelet-registration-path=/var/lib/kubelet/plugins/cert-manager-csi-driver-spiffe/csi.sock
          env:
            - name: KUBE_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          volumeMounts:
            - name: plugin-dir
              mountPath: /plugin
            - name: registration-dir
              mountPath: /registration

        - name: liveness-probe
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            capabilities: { drop: [ "ALL" ] }
            readOnlyRootFilesystem: true
          image: quay.io/jetstack/livenessprobe:v2.19.0@sha256:06da0d5b8908072f2e4522692aee8dc119fba7247a9658497e1153992cd777e9
          imagePullPolicy: IfNotPresent
          args:
            - --csi-address=/plugin/csi.sock
            - --probe-timeout=3s
            - --health-port=9809
            - -v=1
          volumeMounts:
            - name: plugin-dir
              mountPath: /plugin

        - name: cert-manager-csi-driver-spiffe
          securityContext:
            runAsUser: 0
            privileged: true
            capabilities: { drop: [ "ALL" ] }
            readOnlyRootFilesystem: true
          image: quay.io/jetstack/cert-manager-csi-driver-spiffe:v0.15.0@sha256:1755a3802efd8d9443f15e3990ee38b4a52407e26cc242660121e991b3cea0af
          imagePullPolicy: IfNotPresent
          args :
            - --log-level=1

            - --csi-driver-name=spiffe.csi.cert-manager.io

            - --certificate-request-duration=1h
            - --issuer-name=csi-driver-spiffe-ca
            - --issuer-kind=ClusterIssuer
            - --issuer-group=cert-manager.io
            - --trust-domain=cluster.local

            - --file-name-certificate=tls.crt
            - --file-name-key=tls.key
            - --file-name-ca=ca.crt
            - --source-ca-bundle=/var/run/secrets/spiffe.io/trust/ca.pem

            - --node-id=$(NODE_ID)
            - --endpoint=$(CSI_ENDPOINT)
            - --data-root=csi-data-dir
            - "--runtime-issuance-config-map-name="
            - "--runtime-issuance-config-map-namespace=cert-manager"
          env:
            - name: NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: CSI_ENDPOINT
              value: unix://plugin/csi.sock
          volumeMounts:
          - name: plugin-dir
            mountPath: /plugin
          - name: pods-mount-dir
            mountPath: /var/lib/kubelet/pods
            mountPropagation: "Bidirectional"
          - name: csi-data-dir
            mountPath: /csi-data-dir
          - mountPath: /var/run/secrets/spiffe.io/trust
            name: trust-bundle
            readOnly: true
          ports:
            - containerPort: 9809
              name: healthz
          livenessProbe:
            httpGet:
              path: /healthz
              port: healthz
            initialDelaySeconds: 5
            timeoutSeconds: 5
          resources:
            {}
      nodeSelector:
        kubernetes.io/os: linux

      volumes:
      - name: plugin-dir
        hostPath:
          path: /var/lib/kubelet/plugins/cert-manager-csi-driver-spiffe
          type: DirectoryOrCreate
      - name: pods-mount-dir
        hostPath:
          path: /var/lib/kubelet/pods
          type: Directory
      - hostPath:
          path: /var/lib/kubelet/plugins_registry
          type: Directory
        name: registration-dir
      - hostPath:
          path: /tmp/cert-manager-csi-driver
          type: DirectoryOrCreate
        name: csi-data-dir
      - name: trust-bundle
        secret:
          secretName: spiffe-trust-bundle


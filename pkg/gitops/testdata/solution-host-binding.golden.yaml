apiVersion: v1
kind: ConfigMap
metadata:
    name: solution-host-binding-example.prod.crm
    namespace: crm
    labels:
        app.kubernetes.io/managed-by: codefly
        codefly.dev/binding: example.prod.crm
        codefly.dev/document: solution-host-binding
        codefly.dev/solution: crm
data:
    solution-host-binding.codefly.yaml: |
        schema: codefly/solution-host-binding/v1
        binding: example.prod.crm
        generation: 1
        host:
            coordinate: example/prod/region-a
            component: platform-host
        release:
            publisher: example
            name: crm
            version: 1.4.0
        routes:
            - alias: crm
              surface: backend
        artifacts:
            - surface: backend
              name: api
              release: example/crm@1.4.0
              digest: sha256:9176742fd9177b1efc917bbf81818ea6c1c8e5cc4c24bc566607fde43112561f
        modules:
            - module: crm
              package: example/crm
              version: 1.4.0
        endpoints:
            - name: grpc
              service: api
              module: crm
              api: grpc
              visibility: internal
        workload:
            audience: accounts
            subject: crm@example.iam.test

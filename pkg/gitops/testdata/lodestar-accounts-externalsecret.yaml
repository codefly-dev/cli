# spec.data of infra-base's secret-accounts ExternalSecret
# (obin-ai/infra-base gitops/manifests/lodestar-secrets/externalsecrets.yaml).
# The golden reference codefly's projection must reproduce from a lodestar-side
# service-secrets declaration. Copied verbatim; keep in sync if the source changes.
data:

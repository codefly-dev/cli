# A governing scope no role grants: the unit declares delete on its pages,
# and no role is granted it.
schema: codefly/module-contract/v1
principal: assistant
namespaces: []
queues: []
scope_ceilings:
    - resource_kind: assistant.pages
      actions: [read, write, publish, delete]
    - resource_kind: assistant.profiles
      actions: [read]
      shared: true
roles:
    - name: admin
      scopes: [{resource_kind: assistant.pages, actions: [read, publish]}]
    - name: user
      scopes:
          - {resource_kind: assistant.pages, actions: [read, write]}
          - {resource_kind: assistant.profiles, actions: [read]}
          - {resource_kind: documents, actions: [read, write]}
source_governance:
    scopes:
        - resource_kind: assistant.pages
          actions: [write, delete]
bindings:
    - id: documents
      operations: [invoke]
      audience: {from: assistant/documents-audience}
      scope_ceiling:
          invoke:
              - resource_kind: documents
                actions: [read, write]
destinations: []

kind: service
name: api
version: 0.0.1
agent:
  kind: codefly:service
  name: go-grpc
  version: 0.0.1
  publisher: codefly.dev
service-dependencies:
  - name: store
    endpoints:
      - name: tcp
endpoints:
  - name: authority
    api: grpc
    # Nothing outside module `shop` consumes this, and `store` — the only other
    # service here — is inside it, where visibility never gates. `private` is
    # therefore what this endpoint is, and it authors no allow-list: core#711
    # DERIVES allow_modules from consumers' service-dependencies and refuses an
    # authored one, and the derivation over this fixture would produce an empty
    # list, which is private. The earlier `internal` + ["*"] was a faithful
    # translation of the deleted `visibility: module` spelling but wider than
    # anything here needs, and it named a field that is about to be refused.
    visibility: private
  - name: grpc
    api: grpc
  - name: rest
    api: rest
spec:
  rest-endpoint: true

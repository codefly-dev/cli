kind: service
name: api
version: 0.0.1
agent:
  kind: codefly:service
  name: go-grpc
  version: 0.0.1
  publisher: codefly.dev
service-dependencies:
  - name: store
    endpoints:
      - name: tcp
endpoints:
  - name: authority
    api: grpc
    visibility: internal
    allow-modules:
      - "*"
  - name: grpc
    api: grpc
  - name: rest
    api: rest
spec:
  rest-endpoint: true

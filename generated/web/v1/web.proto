syntax = "proto3";
package observability.v1;

import "base/v1/endpoint.proto";
import "base/v1/project.proto";
import "services/agent/v1/agent.proto";

import "observability/v1/inventory.proto";
import "observability/v1/dependencies.proto";
import "observability/v1/logs.proto";

import "google/protobuf/empty.proto";
import "google/api/annotations.proto";


import "google/protobuf/timestamp.proto";

/* Overall information */

message GetProjectsResponse {
  repeated string projects = 1;
}

message ProjectRequest {
  string project = 1;
}

message GetAgentInformationRequest {
  string agent = 1;
}

message MultiGraphResponse {
  repeated GraphResponse graphs = 1;
}

/* Active information
*/

message ActiveResponse {
  string project = 1;
  string application = 2;
  string service = 3;
}

service Web {

  /* Overall information
  */

  rpc GetAgentInformation(GetAgentInformationRequest) returns (agent.v1.AgentInformation) {
    option (google.api.http) = {
      get: "/overall/agent/{agent}/information"
    };
  }

  rpc GetProjects(google.protobuf.Empty) returns (GetProjectsResponse) {
    option (google.api.http) = {
      get: "/overall/project/information"
    };
  }


  rpc GetProjectInventory(ProjectRequest) returns (base.v1.Project) {
    option (google.api.http) = {
      get: "/overall/project/{project}/inventory"
    };
  }

  rpc GetProjectServiceDependencyGraph(ProjectRequest) returns (GraphResponse) {
    option (google.api.http) = {
      get: "/overall/project/{project}/service-dependency-graph"
    };
  }

  rpc GetProjectPublicApplicationsDependencyGraph(ProjectRequest) returns (MultiGraphResponse) {
    option (google.api.http) = {
      get: "/overall/project/{project}/public-applications-graph"
    };
  }


  rpc LogHistory(LogRequest) returns (LogResponse) {
    option (google.api.http) = {
      get: "/overall/project/logs/history"
    };
  }

  /* Active information
  */

  rpc GetActive(google.protobuf.Empty) returns (ActiveResponse) {
    option (google.api.http) = {
      get: "/active/project/information"
    };
  }

  rpc Logs(google.protobuf.Empty)  returns (stream observability.v1.Log) {
    option (google.api.http) = {
      get: "/active/project/logs"
    };
  }


  rpc ActiveLogHistory(LogRequest) returns (LogResponse) {
    option (google.api.http) = {
      get: "/active/project/logs/history"
    };
  }



}

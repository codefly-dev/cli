syntax = "proto3";
package observability.v0;

import "base/v0/endpoint.proto";
import "base/v0/project.proto";
import "base/v0/provider.proto";

import "services/agent/v0/agent.proto";
import "services/runtime/v0/runtime.proto";

import "observability/v0/inventory.proto";
import "observability/v0/dependencies.proto";
import "observability/v0/logs.proto";

import "google/protobuf/empty.proto";
import "google/api/annotations.proto";


import "google/protobuf/timestamp.proto";


/* Overall information */

message GetProjectsResponse {
  repeated string projects = 1;
}

message ProjectRequest {
  string project = 1;
}

message GetAgentInformationRequest {
  string agent = 1;
}

message MultiGraphResponse {
  repeated GraphResponse graphs = 1;
}

/* Active information
*/

message ActiveResponse {
  string project = 1;
  string application = 2;
  string service = 3;
}

message RunningInformation {
  string application = 1;
  string service = 2;
  int32 agent_pid = 3;
}

message GetAddressesRequest {
  string application = 1;
  string service = 2;
  string endpoint = 3;
}

message GetAddressesResponse {
  repeated string addresses = 1;
}


message GetServiceProviderInfoRequest {
  string application = 1;
  string service = 2;
}

message GetServiceProviderInfoResponse {
  repeated base.v0.ProviderInformation provider_infos = 1;
}

service Web {

  /* Overall information
  */

  rpc GetAgentInformation(GetAgentInformationRequest) returns (services.agent.v0.AgentInformation) {
    option (google.api.http) = {
      get: "/overall/agent/{agent}/information"
    };
  }

  rpc GetProjects(google.protobuf.Empty) returns (GetProjectsResponse) {
    option (google.api.http) = {
      get: "/overall/project/information"
    };
  }


  rpc GetProjectInventory(ProjectRequest) returns (base.v0.Project) {
    option (google.api.http) = {
      get: "/overall/project/{project}/inventory"
    };
  }

  rpc GetProjectServiceDependencyGraph(ProjectRequest) returns (GraphResponse) {
    option (google.api.http) = {
      get: "/overall/project/{project}/service-dependency-graph"
    };
  }

  rpc GetProjectPublicApplicationsDependencyGraph(ProjectRequest) returns (MultiGraphResponse) {
    option (google.api.http) = {
      get: "/overall/project/{project}/public-applications-graph"
    };
  }


  rpc LogHistory(LogRequest) returns (LogResponse) {
    option (google.api.http) = {
      get: "/overall/project/logs/history"
    };
  }

  /* Active information
  */

  rpc GetActive(google.protobuf.Empty) returns (ActiveResponse) {
    option (google.api.http) = {
      get: "/active/project/information"
    };
  }


  rpc GetAddresses(GetAddressesRequest) returns (GetAddressesResponse) {
    option (google.api.http) = {
      get: "/active/project/network-mapping/{application}/{service}/{endpoint}"
    };
  }

  rpc GetServiceProviderInformation(GetServiceProviderInfoRequest) returns (GetServiceProviderInfoResponse) {
    option (google.api.http) = {
      get: "/active/project/service-provider-information/{application}/{service}"
    };
  }

  rpc Logs(google.protobuf.Empty)  returns (stream observability.v0.Log) {
    option (google.api.http) = {
      get: "/active/project/logs"
    };
  }

  rpc ActiveLogHistory(LogRequest) returns (LogResponse) {
    option (google.api.http) = {
      get: "/active/project/logs/history"
    };
  }

}

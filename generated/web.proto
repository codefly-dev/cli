syntax = "proto3";
package v1.observability;

import "proto/observability/inventory.proto";
import "proto/observability/dependencies.proto";
import "proto/observability/logs.proto";

import "google/protobuf/empty.proto";
import "google/api/annotations.proto";

import "proto/base/endpoint.proto";
import "proto/base/project.proto";
import "proto/agents/logs.proto";
import "google/protobuf/timestamp.proto";


message GetProjectsResponse {
  repeated string projects = 1;
}

message ProjectInventoryRequest {
  string project = 1;
}

message ServiceDependencyGraphRequest {
  string project = 1;
}

service Web {

  rpc GetProjects(google.protobuf.Empty) returns (GetProjectsResponse) {
    option (google.api.http) = {
      get: "/project/information"
    };
  }


  rpc GetProjectInventory(ProjectInventoryRequest) returns (v1.base.Project) {
    option (google.api.http) = {
      get: "/project/{project}/inventory"
    };
  }

  rpc GetProjectServiceDependencyGraph(ServiceDependencyGraphRequest) returns (GraphResponse) {
    option (google.api.http) = {
      get: "/project/{project}/service-dependency-graph"
    };
  }

  rpc Logs(google.protobuf.Empty)  returns (stream v1.agents.logs.Log) {
    option (google.api.http) = {
      get: "/project/logs"
    };
  }

  rpc LogHistory(LogRequest) returns (LogResponse) {
    option (google.api.http) = {
      get: "/project/logs/history"
    };
  }

}

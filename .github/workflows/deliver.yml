# Deliver a composition's environment: render, then publish under the
# workflow's own identity.
#
# A composition repository calls this workflow from its deploy workflow. The
# publish step settles each delivery document's generation against the
# delivery repository and signs its canonical bytes with THIS workflow run's
# Sigstore keyless identity over GitHub Actions OIDC — which is why the job
# needs `id-token: write` and nothing else: no signing key exists anywhere. A
# host accepts those documents only from the identities on its allowlist
# (repository, workflow path, ref pattern, issuer), so the caller's own
# workflow path and ref are what the host pins, not this file's.
name: Deliver

on:
  workflow_call:
    inputs:
      environment:
        description: The environment to render and publish.
        required: true
        type: string
      codefly-version:
        description: The codefly CLI release to run (a tag, e.g. v0.1.172).
        required: true
        type: string
      go-version:
        description: The Go toolchain that builds the CLI from its tagged source.
        required: false
        type: string
        default: "1.26"
    secrets:
      GITOPS_TOKEN:
        description: A token that may open the promotion pull request on the delivery repository.
        required: true

jobs:
  deliver:
    name: Render and publish ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # The signing identity. Sigstore's Fulcio certifies an ephemeral key for
      # this run's OIDC token; the transparency log records the signature.
      id-token: write
    steps:
      - name: Check out the composition
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ inputs.go-version }}
          cache: false

      - name: Install the codefly CLI at the requested release
        # The module proxy and checksum database verify the tagged source; the
        # version is pinned by the caller so a delivery is reproducible.
        run: go install github.com/codefly-dev/cli@${{ inputs.codefly-version }}

      - name: Render
        run: codefly deploy gitops render --env "${{ inputs.environment }}"

      - name: Publish, signed by this workflow's identity
        env:
          GH_TOKEN: ${{ secrets.GITOPS_TOKEN }}
        run: codefly deploy gitops publish --env "${{ inputs.environment }}"

name: Go CLI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    env:
      # Empty on forks and Dependabot runs, which do not receive repo secrets.
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - name: checkout
        uses: actions/checkout@v4

      # This is both the canonical bootstrap and the cross-repository action
      # contract consumed by Codefly products. Dogfood the local action so a
      # release cannot publish an installer that CI never exercised.
      - name: install Codefly
        uses: ./.github/actions/install

      - name: Cache Go Modules
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}

      - name: Install Dependencies
        run: go mod download

      - name: Verify the composed-module command is packaged
        run: codefly sync module --help

      # govulncheck gate via the CLI (replaces scripts/govulncheck.sh):
      # suppressions + staleness from .govulncheck.yaml, fails only on
      # actionable (upstream-fixed) findings.
      - name: govulncheck audit
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          codefly audit go --dir .
#
#      - name: golangci-lint
#        uses: golangci/golangci-lint-action@v3 # Using 'latest' automatically fetches the latest version
#        with:
#          version: latest

      - name: generate test generate coverage
        run: go test ./... -coverprofile=cover.out -covermode=atomic -coverpkg=./...

      - name: check test coverage
        id: coverage
        uses: vladopajic/go-test-coverage@v2 # Check if a newer version exists
        with:
          config: ./.testcoverage.yaml

      - name: test with race detection
        run: go test -race ./... -v

      - name: Notify Slack on Failure
        if: failure() && env.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@v1.25.0 # Updated to latest known version, verify for newer versions
        with:
          payload: |
            {
              "text": "Build Failed in ${{ github.repository }} on ${{ github.ref }}. See GitHub Actions for more details."
            }

      - name: Notify Slack on Success
        if: success() && env.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@v1.25.0 # Updated to latest known version, verify for newer versions
        with:
          payload: |
            {
              "text": "Build Succeeded in ${{ github.repository }} on ${{ github.ref }}. Great job!"
            }

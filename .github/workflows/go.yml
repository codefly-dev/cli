name: Go CLI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: set up
        uses: actions/setup-go@v4 # Updated to latest major version, verify for minor version updates
        with:
          go-version: '1.26.5' # matches the toolchain directive; clears Go stdlib CVEs in the audit

      - name: checkout
        uses: actions/checkout@v3 # Already latest major version

      - name: Cache Go Modules
        uses: actions/cache@v3 # Already latest major version
        continue-on-error: true
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}

      - name: Install Dependencies
        run: go mod tidy && go mod download

      # Bootstrap the codefly binary (replaces scripts/build/local.sh) so the
      # rest of the pipeline can drive the CLI's own commands. This is also the
      # build verification — a compile failure stops the job here.
      - name: build codefly
        run: |
          go build -o codefly .
          echo "$PWD" >> "$GITHUB_PATH"

      # govulncheck gate via the CLI (replaces scripts/govulncheck.sh):
      # suppressions + staleness from .govulncheck.yaml, fails only on
      # actionable (upstream-fixed) findings.
      - name: govulncheck audit
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          codefly audit go --dir .
#
#      - name: golangci-lint
#        uses: golangci/golangci-lint-action@v3 # Using 'latest' automatically fetches the latest version
#        with:
#          version: latest

      - name: generate test generate coverage
        run: go test ./... -coverprofile=cover.out -covermode=atomic -coverpkg=./...

      - name: check test coverage
        id: coverage
        uses: vladopajic/go-test-coverage@v2 # Check if a newer version exists
        with:
          config: ./.testcoverage.yaml

      - name: test with race detection
        run: go test -race ./... -v

      - name: Notify Slack on Failure
        if: failure()
        uses: slackapi/slack-github-action@v1.25.0 # Updated to latest known version, verify for newer versions
        with:
          payload: |
            {
              "text": "Build Failed in ${{ github.repository }} on ${{ github.ref }}. See GitHub Actions for more details."
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Notify Slack on Success
        if: success()
        uses: slackapi/slack-github-action@v1.25.0 # Updated to latest known version, verify for newer versions
        with:
          payload: |
            {
              "text": "Build Succeeded in ${{ github.repository }} on ${{ github.ref }}. Great job!"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

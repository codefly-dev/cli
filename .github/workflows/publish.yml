name: Publish CLI

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version component to release
        type: choice
        options: [patch, minor, major]
        default: patch
        required: true

permissions:
  contents: read

jobs:
  publish:
    uses: ./.github/workflows/publish-agent.yml
    with:
      bump: ${{ inputs.bump }}
      codefly-version: v0.1.256
      build-publisher: true
    secrets:
      release-token: ${{ secrets.GH_PAT }}

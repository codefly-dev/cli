name: Release

on:
  release:
    types: [released]

jobs:
  build:
    name: Build and Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: set up
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Build Binary Darwin Intel
        run: |
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -ldflags '-s -w' -o codefly-darwin-amd64 main.go
      - name: Build Binary Darwin ARM
        run: |
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -ldflags '-s -w' -o codefly-darwin-arm64 main.go
      - name: Build Binary Linux
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags '-extldflags "-static"' -o codefly-linux-x86_64 main.go
      - name: Checkout Target Repository
        uses: actions/checkout@v5
        with:
          repository: 'codefly-dev/cli-releases'
          token: ${{ secrets.GH_PAT }}
          path: 'cli-releases'

      - name: Copy File to Target Repository
        run: |
          cp ./codefly-darwin-amd64 ./cli-releases/
          cp ./codefly-darwin-arm64 ./cli-releases/
          cp ./codefly-linux-x86_64 ./cli-releases/

      - name: Configure Git with PAT
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"
          git -C cli-releases remote set-url origin https://x-access-token:${{ secrets.GH_PAT }}@github.com/codefly-dev/cli-releases.git


      - name: Commit and Push to Target Repository
        run: |
          cd cli-releases
          git add codefly-darwin-amd64 codefly-darwin-arm64 codefly-linux-x86_64
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Add new release binary"
          git push

      - name: Create cli-releases release and upload binaries
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" --repo codefly-dev/cli-releases >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --repo codefly-dev/cli-releases \
              --target main \
              --title "Release $RELEASE_TAG" \
              --generate-notes
          fi
          gh release upload "$RELEASE_TAG" \
            ./cli-releases/codefly-darwin-amd64 \
            ./cli-releases/codefly-darwin-arm64 \
            ./cli-releases/codefly-linux-x86_64 \
            --repo codefly-dev/cli-releases \
            --clobber

      - name: Check out the formula repository
        uses: actions/checkout@v5
        with:
          repository: codefly-dev/homebrew-cli
          token: ${{ secrets.GH_PAT }}
          path: homebrew-cli

      - name: Update the formula
        working-directory: homebrew-cli
        run: ./update_homebrew.sh ${{ github.event.release.tag_name }}

      - name: Commit and push changes
        run: |
          git -C homebrew-cli config user.name 'GitHub Action'
          git -C homebrew-cli config user.email 'action@github.com'
          if git -C homebrew-cli diff --quiet; then
            echo "Homebrew formula already current"
            exit 0
          fi
          git -C homebrew-cli commit -am "Update formula to version ${{ github.event.release.tag_name }}"
          git -C homebrew-cli push

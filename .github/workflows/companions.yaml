name: Companions

# Keeps the companion images core embeds present in the registry. core pins
# each companion tag (codeflydev/<name>:<version>) via info.codefly.yaml and
# agents pull those exact tags at runtime, so a pinned-but-unpushed tag
# breaks every Codefly-native build at the companion pull. This workflow
# publishes the whole set on release and lets an operator (re)publish from a
# chosen core ref on demand, then verifies every embedded tag resolves.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      core_ref:
        description: 'core ref (tag/branch/sha) to publish companions from'
        required: false
        default: 'main'

jobs:
  publish:
    name: Publish and verify companion images
    runs-on: ubuntu-latest
    steps:
      - name: Check out cli
        uses: actions/checkout@v4
        with:
          path: cli

      - name: Check out core
        uses: actions/checkout@v4
        with:
          repository: codefly-dev/core
          ref: ${{ github.event.inputs.core_ref || 'main' }}
          token: ${{ secrets.GH_PAT }}
          # buildLinuxCLI expects core/ and cli/ as siblings: language
          # companions COPY --from a linux binary cross-compiled from ../cli.
          path: core

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
          cache: false

      - name: Build the codefly CLI
        working-directory: cli
        run: GOWORK=off GOBIN="${{ github.workspace }}/bin" go install ./cmd/codefly

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish every companion at its pinned version
        run: ${{ github.workspace }}/bin/codefly companion publish --all --core-dir "${{ github.workspace }}/core"

      - name: Verify every embedded tag is in the registry
        run: ${{ github.workspace }}/bin/codefly companion verify --core-dir "${{ github.workspace }}/core"

name: Runnable native lifecycle

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: runnable-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Check out qualified Runnable agent source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: codefly-dev/runnable-python
          ref: 29bcbc611469c111e14fa8dbd8f95c36aec6185f
          path: .qualification-agent
      - name: Build the real agent
        working-directory: .qualification-agent
        env:
          GOWORK: 'off'
        run: go build -o "$RUNNER_TEMP/runnable-python" .
      - name: Create, build, relocate, invoke and verify through the CLI
        env:
          GOWORK: 'off'
        run: |
          set -o pipefail
          CODEFLY_RUNNABLE_AGENT_BINARY="$RUNNER_TEMP/runnable-python" \
            go test -tags=integration -v ./pkg/runnable | tee runnable-native.log
      - name: Retain qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runnable-native
          path: runnable-native.log
          if-no-files-found: error

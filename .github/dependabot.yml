# Dependency updates for every ecosystem this repository ships.
#
# Each ecosystem gets TWO catch-all groups, not one: minor+patch in a group that
# is expected to merge, and major alone in a group of its own.
# open-pull-requests-limit caps the ecosystem, not the group, so a single group
# spanning every update type has one bad failure mode: one breaking major bump
# makes the ecosystem's only pull request red, Dependabot regenerates that same
# red pull request every week, and every safe patch waits behind it with no way
# to land — a hand-edit of the group pull request is discarded on the next
# regeneration. Split, the patch stream keeps flowing while the major sits.
#
# Dependabot cannot group across ecosystems, so entries x groups is the floor on
# weekly pull requests.
#
# The github-actions entry exists because every action is pinned by commit SHA;
# nothing else would ever move those pins. It lists `directories`, not
# `directory`: `/` reaches only .github/workflows and a root action.yml, so the
# composite action in .github/actions/install needs its own entry or its pins
# would be the one hole in the pinning. pkg/cliupdate's dependabot contract test
# holds every action manifest directory to that.
version: 2

updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    # The core pin is not an ordinary dependency. docs/runbooks/release-the-fleet.md
    # re-pins it as step 2 of an ordered cross-repo release (core tagged -> cli
    # -> agents -> composed modules), and pkg/conformance/matrix.json records the
    # release line beside it. An unattended bump does one of two bad things: it
    # crosses the line and reds the whole gomod pull request against
    # TestMatrixCoreMatchesGoMod, or it stays inside the line, goes green, and
    # silently moves the CLI off the core the agent fleet was published against.
    # The runbook owns this pin.
    ignore:
      - dependency-name: github.com/codefly-dev/core
    groups:
      gomod:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      gomod-major:
        patterns:
          - "*"
        update-types:
          - major

  # web/dashboard builds into pkg/web/go-grpc/out, a committed artifact go:embed
  # ships in the binary. The `dashboard` job in go.yml rebuilds it and fails on
  # drift, which is what gives these pull requests a real signal — without it a
  # bump here changes only the lockfile and passes every Go gate untested.
  - package-ecosystem: npm
    directory: /web/dashboard
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      npm:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      npm-major:
        patterns:
          - "*"
        update-types:
          - major

  # Limit 4, not 2: if Dependabot bills the two directories separately rather
  # than folding them into one grouped pull request, 2 would cap the ecosystem
  # mid-stream and reintroduce exactly the head-of-line stall the groups above
  # exist to prevent. These pull requests are mechanical SHA bumps; the extra
  # headroom costs nothing.
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/install
    schedule:
      interval: weekly
    open-pull-requests-limit: 4
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      github-actions-major:
        patterns:
          - "*"
        update-types:
          - major

syntax = "proto3";
package v1.services.factory;

import "core/api.proto";
import "core/communicate.proto";
import "services/init.proto";

/*
*/

message InitResponse {
  Version version = 1; // The version of the service
  repeated core.communicate.Channel channels = 2; // The communication channels of the service
}

/*

Creation

 */

message CreateRequest {
}



message CreateResponse {
  bool need_communication = 1;
  repeated v1.core.api.Endpoint endpoints = 2; // The endpoints of the created service
}

/*

Update

*/

message UpdateRequest {
}

message UpdateResponse {
}


/*

Sync re-generate what needs to be re-generated

 */

message SyncRequest {
  v1.core.api.EndpointGroup dependency_endpoint_group = 1;
}

message SyncResponse {
  bool need_communication = 1;
}

/*

Build is the first stage of Deployment

*/

message BuildRequest {
  v1.core.api.EndpointGroup dependency_endpoint_group = 1;
}

message BuildResponse {
}

/*
Deployment
*/

message DeploymentRequest {
}

message DeploymentResponse {
}



service Factory {
  // Setup
  rpc Init (services.InitRequest) returns (InitResponse) {}

  // Affect Code
  rpc Create (CreateRequest) returns (CreateResponse) {}
  rpc Update (UpdateRequest) returns (UpdateResponse) {}

  // Affect Data
  rpc Sync (SyncRequest) returns (SyncResponse) {}

  // Deployment/Build only on init data
  rpc Build (BuildRequest) returns (BuildResponse) {}
  rpc Deploy (DeploymentRequest) returns (DeploymentResponse) {}

  // Communication helper
  rpc Communicate(core.communicate.Engage) returns (core.communicate.InformationRequest) {}
}

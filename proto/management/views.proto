syntax = "proto3";
package v1.management.views;

import "google/protobuf/empty.proto";
import "google/api/annotations.proto";

import "base/api.proto";
import "agents/logs.proto";
import "google/protobuf/timestamp.proto";

message ProjectView {
  string name = 1;
  repeated ApplicationView applications = 3;
}

message ProjectInformationRequest {
}

message ProjectInformationResponse {
  ProjectView project = 1;
}

message ApplicationView {
  string application = 1;
  repeated ServiceView services = 2;
}

message ApplicationInformationRequest {
  string application = 2;
}

message ApplicationInformationResponse {
  ApplicationView application = 1;
}

message ServiceView {
  string service = 1;
  repeated EndpointView endpoints = 2;
}

message EndpointView {
  v1.base.Endpoint endpoint = 1;
}


message ServiceInformationRequest {
  string application = 1;
  string service = 2;
}


message ServiceInformationResponse {
}

message AgentUsageRequest {
  string publisher = 1;
  string name = 2;
}

message Usage {
  string application = 1;
  string service = 2;
}

message AgentUsage {
}

message AgentUsageResponse {
  AgentUsage usage = 1;
}

/*
Logs
*/


message LogRequest {
  google.protobuf.Timestamp from = 1;
  google.protobuf.Timestamp to = 2;
}


message LogResponse {
  repeated v1.agents.logs.LogSessionGroup groups = 1;
}

/*
Dependency Graph

*/

message DependencyGraphRequest {
}


message GraphNode {
  string id = 1;
  bool value = 2;
}

message GraphEdge {
  string from = 1;
  string to = 2;
}

message GraphResponse {
  repeated GraphNode nodes = 1;
  repeated GraphEdge edges = 2;
}


service Web {

  rpc GetProjectInformation(ProjectInformationRequest) returns (ProjectInformationResponse) {
    option (google.api.http) = {
      get: "/project/information"
    };
  }

  rpc GetDependencyGraph(DependencyGraphRequest) returns (GraphResponse) {
    option (google.api.http) = {
      get: "/project/dependency-graph"
    };
  }

  rpc Logs(google.protobuf.Empty)  returns (stream v1.agents.logs.Log) {
    option (google.api.http) = {
      get: "/project/logs"
    };
  }

  rpc LogHistory(LogRequest) returns (LogResponse) {
    option (google.api.http) = {
      get: "/project/logs/history"
    };
  }

}

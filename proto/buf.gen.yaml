version: v1
managed:
  enabled: true
  go_package_prefix:
    default: github.com/codefly-dev/cli/proto/v1
    except:
      - buf.build/googleapis/googleapis
plugins:
  - plugin: buf.build/protocolbuffers/go
    out: v1
    opt: paths=source_relative
  - plugin: buf.build/grpc/go
    out: v1
    opt: paths=source_relative
  - name: grpc-gateway
    out: v1
    opt:
      - paths=source_relative
  - name: openapiv2
    out: swagger
#  - name: python_betterproto
#    out: v1/python
#    opt: paths=source_relative
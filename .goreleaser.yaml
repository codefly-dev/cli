version: 2

project_name: codefly

builds:
  # ARCHITECTURE: Core's authoritative source inspection uses real
  # tree-sitter grammars. CLI releases therefore require CGO and the
  # platform compilers supplied by goreleaser/goreleaser-cross; disabling
  # CGO would make the production Gateway impossible to ship.
  - id: darwin-amd64
    main: ./cmd/codefly
    binary: codefly
    env:
      - CGO_ENABLED=1
      - CC=o64-clang
      - CXX=o64-clang++
    goos:
      - darwin
    goarch:
      - amd64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/codefly-dev/cli/pkg/cliupdate.version={{ .Version }}
      - -X github.com/codefly-dev/cli/pkg/cliupdate.commit={{ .Commit }}
      - -X github.com/codefly-dev/cli/pkg/cliupdate.buildDate={{ .Date }}
  - id: darwin-arm64
    main: ./cmd/codefly
    binary: codefly
    env:
      - CGO_ENABLED=1
      - CC=oa64-clang
      - CXX=oa64-clang++
    goos:
      - darwin
    goarch:
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/codefly-dev/cli/pkg/cliupdate.version={{ .Version }}
      - -X github.com/codefly-dev/cli/pkg/cliupdate.commit={{ .Commit }}
      - -X github.com/codefly-dev/cli/pkg/cliupdate.buildDate={{ .Date }}
  - id: linux-amd64
    main: ./cmd/codefly
    binary: codefly
    env:
      - CGO_ENABLED=1
      - CC=x86_64-linux-gnu-gcc
      - CXX=x86_64-linux-gnu-g++
    goos:
      - linux
    goarch:
      - amd64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/codefly-dev/cli/pkg/cliupdate.version={{ .Version }}
      - -X github.com/codefly-dev/cli/pkg/cliupdate.commit={{ .Commit }}
      - -X github.com/codefly-dev/cli/pkg/cliupdate.buildDate={{ .Date }}
  - id: linux-arm64
    main: ./cmd/codefly
    binary: codefly
    env:
      - CGO_ENABLED=1
      - CC=aarch64-linux-gnu-gcc
      - CXX=aarch64-linux-gnu-g++
    goos:
      - linux
    goarch:
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/codefly-dev/cli/pkg/cliupdate.version={{ .Version }}
      - -X github.com/codefly-dev/cli/pkg/cliupdate.commit={{ .Commit }}
      - -X github.com/codefly-dev/cli/pkg/cliupdate.buildDate={{ .Date }}

notarize:
  macos:
    # Signing is an optional release capability. Repositories without the
    # complete Apple credential set must still publish unsigned archives;
    # enabling notarization with partial credentials only defers the failure
    # until after qualification and all cross-platform builds have succeeded.
    - enabled: '{{ and (not .IsSnapshot) (ne .Env.MACOS_SIGN_P12 "") (ne .Env.MACOS_SIGN_PASSWORD "") (ne .Env.MACOS_NOTARY_ISSUER_ID "") (ne .Env.MACOS_NOTARY_KEY_ID "") (ne .Env.MACOS_NOTARY_KEY "") }}'
      ids:
        - darwin-amd64
        - darwin-arm64
      sign:
        certificate: "{{ .Env.MACOS_SIGN_P12 }}"
        password: "{{ .Env.MACOS_SIGN_PASSWORD }}"
      notarize:
        issuer_id: "{{ .Env.MACOS_NOTARY_ISSUER_ID }}"
        key_id: "{{ .Env.MACOS_NOTARY_KEY_ID }}"
        key: "{{ .Env.MACOS_NOTARY_KEY }}"
        wait: true
        timeout: 20m

archives:
  - id: codefly
    ids:
      - darwin-amd64
      - darwin-arm64
      - linux-amd64
      - linux-arm64
    formats:
      - tar.gz
    name_template: "codefly_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

sboms:
  - id: archives
    artifacts: archive
    documents:
      - "${artifact}.sbom.json"
    disable: false

signs:
  - id: checksums
    artifacts: checksum
    signature: "${artifact}.sig"
    cmd: openssl
    args:
      - dgst
      - -sha256
      - -sign
      - "{{ .Env.CODEFLY_RELEASE_SIGNING_KEY_PATH }}"
      - -out
      - "${signature}"
      - "${artifact}"

homebrew_casks:
  - name: codefly
    ids:
      - codefly
    binaries:
      - codefly
    directory: Casks
    homepage: https://codefly.ai
    description: Build, run, test, and deploy services in a Codefly workspace
    skip_upload: auto
    url:
      template: "https://github.com/codefly-dev/cli/releases/download/{{ .Tag }}/{{ .ArtifactName }}"
      verified: "github.com/codefly-dev/cli/"
    repository:
      owner: codefly-dev
      name: homebrew-cli
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
      branch: main
    commit_author:
      name: Codefly Release
      email: action@github.com

release:
  mode: keep-existing
  prerelease: auto
  make_latest: auto
  replace_existing_artifacts: false
  replace_existing_draft: false
  use_existing_draft: false

version: "2"

run:
  timeout: 5m

linters:
  enable:
    - goconst
    - gocritic
    - gocyclo
    - gosec
    - misspell
    - prealloc
    - revive
  disable:
    - gochecknoglobals
    - gochecknoinits
  settings:
    errcheck:
      check-type-assertions: true
    govet:
      enable:
        - shadow
    gocritic:
      enabled-checks:
        - rangeValCopy
        - appendCombine
        - hugeParam
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - govet
        text: composite literal uses unkeyed fields
      - linters:
          - revive
        text: should have comment or be unexported
    paths:
      - .*\.pb\.go$
      - .*\.pb\.gw\.go$
      - .*_test\.go$
      - third_party$
      - builtin$
      - examples$

formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - .*\.pb\.go$
      - .*\.pb\.gw\.go$
      - .*_test\.go$
      - third_party$
      - builtin$
      - examples$

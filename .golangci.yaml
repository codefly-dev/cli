version: "2"

run:
  # A cold-cache analysis of the whole repository is slower than a single test
  # gate. Keep this below the lint job's timeout in go.yml (leaving room for
  # checkout and toolchain setup) so an overrun surfaces as a linter timeout
  # rather than a hard job kill.
  timeout: 8m

linters:
  enable:
    - goconst
    - gocritic
    - gocyclo
    - gosec
    - misspell
    - prealloc
    - revive
  disable:
    - gochecknoglobals
    - gochecknoinits
  settings:
    errcheck:
      check-type-assertions: true
    govet:
      enable:
        - shadow
    gocritic:
      enabled-checks:
        - rangeValCopy
        - appendCombine
        - hugeParam
  exclusions:
    generated: lax
    # These presets reconstruct golangci-lint v1's default exclusion set, which
    # was active in the old config (exclude-use-default defaulted to true and
    # was never disabled). They preserve prior behavior, not broaden it.
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - govet
        text: composite literal uses unkeyed fields
      - linters:
          - revive
        text: should have comment or be unexported
    paths:
      - .*\.pb\.go$
      - .*\.pb\.gw\.go$
      - .*_test\.go$
      - third_party$
      - builtin$
      - examples$

formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - .*\.pb\.go$
      - .*\.pb\.gw\.go$
      - .*_test\.go$
      - third_party$
      - builtin$
      - examples$
